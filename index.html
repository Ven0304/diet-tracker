<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="饮食记录">
<meta name="theme-color" content="#F2F2F7">
<meta name="color-scheme" content="light">
<meta name="format-detection" content="telephone=no">
<meta name="app" content="diet-tracker">
<title>饮食记录</title>
<link rel="apple-touch-icon" id="touch-icon" href="data:,">
<style>
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --label:#000000;
  --label2:rgba(60,60,67,.6); --label3:rgba(60,60,67,.3);
  --sep:rgba(60,60,67,.2); --fill:rgba(118,118,128,.12); --pressed:#E5E5EA;
  --blue:#007AFF; --green:#34C759; --red:#FF3B30; --orange:#FF9500; --pink:#FF2D55; --purple:#AF52DE; --gray:#8E8E93;
  --radius:12px;
  /* 苹果设备上就是 SF Pro + 苹方；其他系统尽量找相近的字体 */
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro","PingFang SC","Helvetica Neue","Inter","Segoe UI","Hiragino Sans GB","Microsoft YaHei UI","Microsoft YaHei",sans-serif;
  --rounded:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Segoe UI",sans-serif;
  /* 动效曲线：iOS 面板弹簧 / 减速 / 轻微回弹 */
  --spring:cubic-bezier(.32,.72,0,1);
  --out:cubic-bezier(.2,.8,.2,1);
  --bounce:cubic-bezier(.34,1.45,.64,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--label);font-family:var(--font);font-size:17px;line-height:1.3;letter-spacing:-.41px;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;-webkit-text-size-adjust:100%;text-size-adjust:100%;
  transition:background-color .45s var(--spring)}
body.sheet-open{background:#000;overflow:hidden}
button{font:inherit;color:inherit;letter-spacing:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}
input{font:inherit;color:inherit;letter-spacing:inherit}
.num{font-family:var(--rounded);font-variant-numeric:tabular-nums}
.muted{color:var(--label2)}

.app{max-width:560px;margin:0 auto;min-height:100vh;background:var(--bg);
  padding:calc(env(safe-area-inset-top) + 4px) 16px calc(env(safe-area-inset-bottom) + 100px);
  transform-origin:50% 0;transition:transform .5s var(--spring)}
body.sheet-open .app{transform:translateY(calc(env(safe-area-inset-top) + 10px)) scale(.92)}
.view{display:none}
.view.active{display:block;animation:fade .2s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* 滚动后出现的小标题导航栏 */
.navbar{position:fixed;top:0;left:0;right:0;z-index:9;height:calc(env(safe-area-inset-top) + 44px);padding-top:env(safe-area-inset-top);
  display:flex;justify-content:center;background:rgba(249,249,249,.86);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-bottom:.5px solid rgba(0,0,0,.16);opacity:0;pointer-events:none;transition:opacity .2s}
.navbar.show{opacity:1;pointer-events:auto}
.navbar-title{height:44px;line-height:44px;font-size:17px;font-weight:600;opacity:0;transform:translateY(8px);transition:opacity .25s,transform .35s var(--out)}
.navbar.show .navbar-title{opacity:1;transform:none}
body.sheet-open .navbar{opacity:0;pointer-events:none}

/* 大标题 */
.header{padding:4px 4px 14px}
.header-bar{display:flex;align-items:center;justify-content:space-between;min-height:44px;gap:8px}
.nav-group{display:flex;align-items:center;gap:8px}
.eyebrow{margin:8px 0 0;font-size:13px;font-weight:600;letter-spacing:-.08px;color:var(--label2)}
h1{margin:0;font-size:34px;line-height:41px;font-weight:700;letter-spacing:.37px}
.icon-btn{width:34px;height:34px;border-radius:17px;display:inline-flex;align-items:center;justify-content:center;color:var(--blue);flex:none;
  transition:transform .3s var(--out),opacity .2s}
.icon-btn.filled{background:var(--fill)}
.icon-btn svg{width:18px;height:18px}
.icon-btn:active{transform:scale(.88);opacity:.55;transition:none}
.icon-btn:disabled{color:var(--label3);cursor:default}
.icon-btn:disabled:active{transform:none;opacity:1}
.pill{font-size:15px;font-weight:500;letter-spacing:-.24px;color:var(--blue);padding:7px 13px;border-radius:17px;background:var(--fill);
  transition:transform .3s var(--out),opacity .2s;animation:pillIn .35s var(--bounce)}
.pill:active{transform:scale(.94);opacity:.55;transition:none}
@keyframes pillIn{from{opacity:0;transform:scale(.8)}}

/* 卡片与分组列表 */
.card{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:24px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.card-title{font-size:17px;font-weight:600}
.section-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:0 16px 7px;font-size:13px;letter-spacing:-.08px;color:var(--label2)}
.section-head.big{padding:0 4px 8px}
.section-head.big .t{font-size:20px;font-weight:700;letter-spacing:.38px;color:var(--label)}
.section-head.big .m{font-size:15px;letter-spacing:-.24px}
.list{background:var(--card);border-radius:var(--radius);overflow:hidden;margin-bottom:24px}
.row,.field{position:relative;display:flex;align-items:center;gap:12px;min-height:44px;width:100%}
.row{padding:11px 16px;text-align:left}
.list>.row+.row::before,.list>.field+.field::before,.list>.row+.field::before,.list>.field+.row::before{
  content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
button.row,label.row{transition:background-color .35s}
button.row:active,label.row:active{background:var(--pressed);transition:none}
button.row:disabled{opacity:.4}
button.row:disabled:active{background:none}
.row.enter{animation:rowIn .5s var(--spring)}
@keyframes rowIn{from{opacity:0;transform:translateY(-10px)}}
.row-main{flex:1;min-width:0}
.row-title{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-title .muted{font-size:15px;letter-spacing:-.24px;margin-left:4px}
.row-sub{font-size:13px;letter-spacing:-.08px;color:var(--label2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-value{font-size:17px;color:var(--label2);white-space:nowrap}
.row-value small{font-size:13px;letter-spacing:-.08px}
.chev{color:var(--label3);display:inline-flex}
.chev svg{width:14px;height:14px}
.add-row{color:var(--blue)}
.add-row svg{width:18px;height:18px;flex:none}
.row.danger{color:var(--red)}
.row.link{color:var(--blue)}
.footer-note{font-size:13px;letter-spacing:-.08px;color:var(--label2);padding:0 16px;margin:-17px 0 24px;line-height:1.45}

/* 表单 */
.field{padding:0 16px}
.field>label{flex:none;min-width:64px;font-size:17px}
.field .grow{flex:1}
.field input.in{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:17px;padding:11px 0;text-align:right;color:var(--label);border-radius:0;-webkit-appearance:none;appearance:none}
.field input.in.left{text-align:left}
.field input.in::placeholder{color:var(--label3)}
.field input[type=date].in{min-height:44px;display:flex;justify-content:flex-end}
.field input[type=date].in::-webkit-date-and-time-value{text-align:right}
.field .unit{color:var(--label2);font-size:17px;min-width:30px}
.switch{position:relative;width:51px;height:31px;flex:none}
.switch input{position:absolute;inset:0;margin:0;opacity:0;z-index:1;cursor:pointer}
.switch span{position:absolute;inset:0;background:rgba(120,120,128,.16);border-radius:16px;transition:background .25s}
.switch span::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:16px;background:#fff;
  box-shadow:0 3px 8px rgba(0,0,0,.15),0 3px 1px rgba(0,0,0,.06);transition:transform .35s var(--spring),width .2s var(--out)}
.switch input:checked+span{background:var(--green)}
.switch input:checked+span::after{transform:translateX(20px)}
.switch input:active+span::after{width:33px}
.switch input:checked:active+span::after{transform:translateX(14px)}

/* 分段控件（白色滑块会滑动） */
.segmented{position:relative;display:flex;background:var(--fill);border-radius:9px;padding:2px;isolation:isolate}
.segmented button{position:relative;z-index:1;flex:1;min-width:0;padding:7px 6px;font-size:13px;font-weight:500;letter-spacing:-.08px;border-radius:7px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .2s}
.segmented button.on{font-weight:600}
.segmented button:not(.on):active{opacity:.5;transition:none}
.seg-thumb{position:absolute;z-index:0;top:2px;bottom:2px;left:0;width:0;border-radius:7px;background:#fff;
  box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04);transition:transform .4s var(--spring),width .4s var(--spring)}
.seg-thumb.instant{transition:none}
.segmented.small button{padding:5px 10px}
.segmented.mb{margin-bottom:24px}

/* 按钮 */
.btn{display:block;width:100%;padding:14px;border-radius:12px;background:var(--blue);color:#fff;font-size:17px;font-weight:600;text-align:center;margin-bottom:24px;
  transition:transform .35s var(--out),opacity .2s}
.btn:active{transform:scale(.97);opacity:.8;transition:transform .1s var(--out),opacity .1s}
.btn.plain{background:var(--card);color:var(--blue);font-weight:400}
.btn.danger{background:var(--card);color:var(--red);font-weight:400}
.btn.tight{margin-top:-12px}

/* 今日总览 */
.summary{display:flex;align-items:center;gap:18px}
.rings{width:128px;height:128px;flex:none}
.ring-prog{transition:stroke-dashoffset 1.1s var(--out),stroke-opacity .25s}
.legend{flex:1;min-width:0;display:flex;flex-direction:column;gap:9px}
.leg-label{font-size:13px;font-weight:600;letter-spacing:-.08px}
.leg-val{font-size:22px;font-weight:600;letter-spacing:.35px;line-height:1.15;white-space:nowrap}
.leg-val .of{font-size:13px;color:var(--label2);font-weight:500;letter-spacing:-.08px;margin-left:2px}
.carb-line{display:flex;justify-content:space-between;margin-top:14px;padding-top:12px;border-top:.5px solid var(--sep);font-size:15px;letter-spacing:-.24px;color:var(--label2)}
.carb-line b{color:var(--label);font-weight:600}
.tile{width:29px;height:29px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;flex:none;color:#fff}
.tile svg{width:17px;height:17px}
.insight{font-size:15px;letter-spacing:-.24px;line-height:1.4}
.insight b{font-weight:600}

/* 统计 */
.stats{display:grid;grid-template-columns:repeat(3,1fr);row-gap:16px;column-gap:8px}
.stat .k{font-size:13px;letter-spacing:-.08px;color:var(--label2)}
.stat .v{font-size:22px;font-weight:600;letter-spacing:.35px;margin-top:3px;white-space:nowrap}
.stat .v small{font-size:13px;color:var(--label2);font-weight:500;letter-spacing:-.08px;margin-left:2px}
.advice{display:flex;gap:12px;align-items:flex-start}
.advice-title{font-size:17px;font-weight:600;margin-top:4px}
.advice-text{font-size:15px;letter-spacing:-.24px;color:var(--label2);line-height:1.45;margin-top:3px}
.delta{font-size:13px;letter-spacing:-.08px;color:var(--label2);font-family:var(--rounded)}
.delta.down{color:var(--green)}
.week-nav{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.week-label{font-size:17px;font-weight:600}
.badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.07px;color:#fff;border-radius:5px;padding:1px 5px;margin-left:6px;vertical-align:2px;background:var(--blue)}
.badge.B{background:var(--purple)}

/* 图表 */
.chart{display:block;width:100%;height:auto}
.chart .ax{font-size:10px;fill:rgba(60,60,67,.6);font-family:var(--font);letter-spacing:0}
.chart .ax.today{fill:var(--blue);font-weight:700}
.chart .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.2s var(--out) .1s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.chart .pop{opacity:0;animation:pop .45s var(--out) forwards}
@keyframes pop{to{opacity:1}}
.chart .grow{transform-box:fill-box;transform-origin:50% 100%;animation:grow .75s var(--spring) both}
@keyframes grow{from{transform:scaleY(0)}}
.empty-chart{height:130px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--label2);font-size:15px;letter-spacing:-.24px;padding:0 24px}
.chart-legend{display:flex;gap:16px;font-size:13px;letter-spacing:-.08px;color:var(--label2);margin-top:8px}
.chart-legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}
.chart-legend i.line{width:14px;height:3px;border-radius:2px}

/* 底部标签栏 */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:space-around;
  padding:7px 0 calc(env(safe-area-inset-bottom) + 7px);
  background:rgba(249,249,249,.9);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-top:.5px solid rgba(0,0,0,.18)}
.tab{flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:500;letter-spacing:.1px;color:var(--gray);transition:color .2s}
.tab svg{width:26px;height:26px}
.tab svg.bounce{animation:bounce .5s ease}
@keyframes bounce{0%{transform:scale(1)}30%{transform:scale(.8)}65%{transform:scale(1.1)}100%{transform:scale(1)}}
.tab.on{color:var(--blue)}

/* 底部弹出面板 */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.22);opacity:0;pointer-events:none;transition:opacity .4s var(--spring);z-index:20;touch-action:none}
.backdrop.open{opacity:1;pointer-events:auto}
.backdrop.dragging{transition:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:560px;margin:0 auto;background:var(--bg);
  border-radius:14px 14px 0 0;transform:translateY(105%);transition:transform .5s var(--spring);
  max-height:calc(100% - env(safe-area-inset-top) - 28px);display:flex;flex-direction:column;box-shadow:0 -1px 20px rgba(0,0,0,.08)}
.sheet.open{transform:none}
.sheet.dragging{transition:none}
.sheet-top{flex:none;touch-action:none;cursor:grab}
.grabber{width:36px;height:5px;border-radius:3px;background:rgba(60,60,67,.3);margin:6px auto 0}
.sheet-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:10px 16px 12px}
.sheet-head .title{font-weight:600;font-size:17px}
.sheet-head .left{justify-self:start;color:var(--blue);font-size:17px}
.sheet-head .right{justify-self:end;color:var(--blue);font-size:17px;font-weight:600}
.sheet-head button{transition:opacity .2s}
.sheet-head button:active{opacity:.4;transition:none}
.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:4px 16px calc(env(safe-area-inset-bottom) + 24px)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 24px;padding:2px 16px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--card);border-radius:18px;padding:8px 14px;font-size:15px;letter-spacing:-.24px;white-space:nowrap;transition:transform .35s var(--out),background-color .3s}
.chip:active{transform:scale(.94);background:var(--pressed);transition:transform .1s var(--out)}
.chip small{color:var(--label2);margin-left:6px;font-size:13px;letter-spacing:-.08px}
.hint-btn{display:block;width:100%;text-align:left;background:rgba(0,122,255,.1);color:var(--blue);border-radius:10px;padding:10px 14px;font-size:15px;letter-spacing:-.24px;margin:-12px 0 24px;animation:pop .3s var(--out)}
.hint-btn[hidden]{display:none}
.paste-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px;margin-bottom:24px;border-radius:12px;
  background:rgba(0,122,255,.1);color:var(--blue);font-size:17px;font-weight:600;transition:transform .35s var(--out),opacity .2s}
.paste-btn:active{transform:scale(.97);opacity:.7;transition:transform .1s var(--out),opacity .1s}
.paste-btn svg{width:20px;height:20px;flex:none}
.paste-box{margin-top:-12px;animation:pop .3s var(--out)}
.paste-box[hidden]{display:none}
.paste-box textarea{display:block;width:100%;min-height:96px;border:0;outline:0;resize:none;padding:12px 16px;background:transparent;
  font-family:var(--font);font-size:15px;letter-spacing:-.24px;line-height:1.45;color:var(--label)}
.paste-box textarea::placeholder{color:var(--label3)}
.field.flash{animation:flash 1.2s var(--out)}
@keyframes flash{from{background:rgba(52,199,89,.22)}}
.copy-area{width:100%;height:50vh;border:0;border-radius:12px;padding:12px;font-size:13px;line-height:1.5;background:var(--card);resize:none;outline:0;font-family:var(--font)}

/* 提示 */
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 86px);z-index:30;transform:translate(-50%,18px) scale(.94);
  display:flex;align-items:center;gap:16px;max-width:calc(100% - 32px);padding:11px 18px;border-radius:22px;
  background:rgba(28,28,30,.92);color:#fff;font-size:15px;letter-spacing:-.24px;white-space:nowrap;opacity:0;pointer-events:none;
  transition:opacity .25s,transform .45s var(--bounce)}
.toast.show{opacity:1;transform:translate(-50%,0) scale(1);pointer-events:auto}
.toast span{overflow:hidden;text-overflow:ellipsis}
.toast button{color:#64D2FF;font-weight:600;flex:none}

/* 隐藏滚动条（iPhone 上本来就是自动隐藏的） */
html,.sheet-body{scrollbar-width:none}
html::-webkit-scrollbar,body::-webkit-scrollbar,.sheet-body::-webkit-scrollbar{display:none}

/* 训练 */
.segmented.mb-s{margin-bottom:12px}
.train-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.train-count{font-size:15px;letter-spacing:-.24px;color:var(--label2)}
.train-count b{font-size:22px;font-weight:600;letter-spacing:.35px;color:var(--label);margin-right:2px}
.progress{height:6px;border-radius:3px;background:var(--fill);overflow:hidden;margin-top:12px}
.progress i{display:block;height:100%;width:0;border-radius:3px;background:var(--green);transition:width .6s var(--spring)}
.text-btn{font-size:15px;letter-spacing:-.24px;color:var(--blue);padding:4px 0;transition:opacity .2s}
.text-btn:active{opacity:.4;transition:none}
.text-btn:disabled{color:var(--label3)}
.ex-card{padding:14px 16px 4px}
.ex-head{display:flex;align-items:center;gap:12px}
.ex-idx{width:26px;height:26px;border-radius:13px;background:var(--fill);font-family:var(--rounded);font-size:13px;font-weight:600;letter-spacing:0;
  display:inline-flex;align-items:center;justify-content:center;flex:none;transition:background-color .3s,color .3s}
.ex-idx svg{width:15px;height:15px}
.ex-card.all-done .ex-idx{background:var(--green);color:#fff}
.ex-name{font-size:17px;font-weight:600}
.ex-info{font-size:13px;letter-spacing:-.08px;color:var(--label2);margin:8px 0 0 38px;line-height:1.45}
.ex-info b{font-weight:600;color:var(--label)}
.sets{margin-top:8px}
.set{position:relative;display:flex;align-items:center;gap:8px;padding:7px 0}
.set+.set::before{content:"";position:absolute;top:0;left:38px;right:0;height:.5px;background:var(--sep)}
.set-no{width:26px;text-align:center;font-family:var(--rounded);font-size:15px;color:var(--label2);flex:none}
.set-field{display:flex;align-items:center;gap:4px;height:36px;padding:0 10px;border-radius:8px;background:var(--fill);flex:1;max-width:116px;min-width:0}
.set-field input{width:100%;min-width:0;border:0;outline:0;background:transparent;font-family:var(--rounded);font-size:17px;font-variant-numeric:tabular-nums;text-align:right;color:var(--label);padding:0}
.set-field input::placeholder{color:var(--label3)}
.set-field span{font-size:13px;color:var(--label2);flex:none}
.set-x{color:var(--label3);font-size:15px;flex:none}
.set.done .set-field input{color:var(--label2)}
.set-btn{margin-left:auto;width:32px;height:32px;border-radius:16px;border:2px solid rgba(60,60,67,.28);display:inline-flex;align-items:center;justify-content:center;
  color:transparent;flex:none;transition:background-color .25s,border-color .25s,transform .3s var(--out)}
.set-btn svg{width:17px;height:17px}
.set-btn:active{transform:scale(.85);transition:none}
.set.done .set-btn{background:var(--green);border-color:var(--green);color:#fff}
.set-btn.just{animation:check .45s var(--bounce)}
@keyframes check{from{transform:scale(.55)}}
.ex-foot{display:flex;justify-content:flex-end;padding:2px 0 6px}

<script>
(function(){
'use strict';

const KEY = 'dietTracker.v1';
const MEALS = [['breakfast','早餐'],['lunch','午餐'],['dinner','晚餐'],['snack','加餐']];
const MEAL_NAME = Object.fromEntries(MEALS);
const WEEK = ['周日','周一','周二','周三','周四','周五','周六'];
const WHEY_PROTEIN = 22.5; // 每勺蛋白粉的蛋白质（g）
const C = {kcal:'#FF2D55', protein:'#34C759', fat:'#FF9500', carbs:'#AF52DE', blue:'#007AFF', red:'#FF3B30', gray:'#8E8E93'};
const reducedMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

const I = {
  left:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  right:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  plusCircle:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="currentColor"/><path d="M12 7v10M7 12h10" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg>',
  chev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
  flame:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.5 2.5c.6 3.6 4.9 5.3 4.9 10.6A5.4 5.4 0 0 1 12 18.5a5.4 5.4 0 0 1-5.4-5.4c0-2.4 1.2-4 2.3-5 .1 2 1 3.2 2.2 3.4-.3-3.2.2-6.2 1.4-9z" transform="translate(0 1.5)"/></svg>',
  bolt:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M13.5 2L5 13.5h6L10 22l9-12h-6.2z"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  info:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="6.5" r="1.8"/><rect x="10.4" y="10" width="3.2" height="9.5" rx="1.6"/></svg>',
  down:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v13M6 12l6 6 6-6"/></svg>',
  warn:'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="10.4" y="4" width="3.2" height="11" rx="1.6"/><circle cx="12" cy="19" r="1.9"/></svg>',
  dumbbell:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M3 9.5v5M7 6.5v11M17 6.5v11M21 9.5v5M7 12h10"/></svg>',
  grip:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 8h14M5 12h14M5 16h14"/></svg>',
  paste:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2.5"/><path d="M9 4.5v-1a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v1M9 11h6M9 15h4"/></svg>',
  moon:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>',
};

/* ---------- 数据 ---------- */
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
// 训练计划 V1.2
function defaultPlan(){
  const ex = (name, sets, reps, rest, note) => ({id: uid(), name, sets, reps, rest, note: note || ''});
  return {days: [
    {id: 'A', code: 'A', name: '胸+背', cardio: '爬坡 20–30 分钟', exercises: [
      ex('平板杠铃卧推', 3, '6–10', '3分钟'),
      ex('中立握辅助引体', 4, '6–12', '3分钟', '重量填辅助重量，逐步减少辅助'),
      ex('高位绳索夹胸', 2, '10–15', '90–120秒', '向前下方夹'),
      ex('窄握坐姿划船', 2, '8–12', '2–3分钟', '手肘向髋部'),
      ex('固定器械上斜胸推', 2, '8–12', '2–3分钟'),
      ex('胸托器械划船', 2, '8–12', '2–3分钟', '适度外展手肘'),
      ex('器械侧平举', 2, '12–15', '60–90秒'),
    ]},
    {id: 'B', code: 'B', name: '肩+腿+腹', cardio: '轻至中等强度 10–20 分钟，腿太累就跳过', exercises: [
      ex('器械侧平举', 3, '10–15', '90–120秒'),
      ex('器械推肩', 2, '8–12', '2–3分钟', '肩前侧疲劳或不适时，先减少或取消'),
      ex('反向蝴蝶机', 2, '10–15', '90–120秒'),
      ex('深蹲器械', 3, '8–12', '2–3分钟'),
      ex('俯卧腿弯举', 3, '10–15', '90–120秒'),
      ex('器械臀推', 2, '8–12', '2分钟'),
      ex('跪姿负重绳索卷腹', 3, '10–15', '90–120秒', '腿累跪不稳时改坐姿卷腹机'),
    ]},
  ]};
}
function defaults(){
  return {
    version: 1,
    settings: {kcal: 2450, protein: 160, fat: 70, carbs: null},
    meals: [], weights: [], training: {}, lastExport: null,
    plan: defaultPlan(), workouts: {},
    presets: [
      {id: uid(), name: '燕麦50g + 蛋白粉1勺', type: 'breakfast', kcal: 304, protein: 29, fat: 5.2, carbs: 35.8},
      {id: uid(), name: '蛋白粉1勺', type: 'snack', kcal: 114, protein: 22.5, fat: 1.9, carbs: 1.8},
    ],
  };
}
function normalize(d){
  const base = defaults();
  if (!d || typeof d !== 'object') return base;
  return {
    version: 1,
    settings: Object.assign({}, base.settings, d.settings || {}),
    meals: Array.isArray(d.meals) ? d.meals.filter(m => m && m.id && m.date) : [],
    weights: Array.isArray(d.weights) ? d.weights.filter(w => w && w.date && isFinite(w.kg)) : [],
    training: d.training && typeof d.training === 'object' ? d.training : {},
    presets: Array.isArray(d.presets) ? d.presets.filter(p => p && p.id) : base.presets,
    lastExport: d.lastExport || null,
    plan: d.plan && Array.isArray(d.plan.days) && d.plan.days.length ? d.plan : base.plan,
    workouts: d.workouts && typeof d.workouts === 'object' ? d.workouts : {},
  };
}
let storageOK = true;
function load(){
  try { const raw = localStorage.getItem(KEY); return normalize(raw ? JSON.parse(raw) : null); }
  catch (e) { storageOK = false; return defaults(); }
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(data)); storageOK = true; }
  catch (e) { storageOK = false; toast('保存失败：浏览器存储不可用'); }
}
let data = load();

/* ---------- 工具函数 ---------- */
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, '0');
const ds = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = () => ds(new Date());
const pd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = pd(s); d.setDate(d.getDate() + n); return ds(d); };
const diffDays = (a, b) => Math.round((pd(b) - pd(a)) / 864e5);
const monday = s => { const d = pd(s); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return ds(d); };
const md = s => { const d = pd(s); return (d.getMonth() + 1) + '月' + d.getDate() + '日'; };
const mdShort = s => { const d = pd(s); return (d.getMonth() + 1) + '/' + d.getDate(); };
const wd = s => WEEK[pd(s).getDay()];
function num(v){
  if (v === '' || v == null) return null;
  const n = parseFloat(String(v).replace('，', '.').replace(',', '.').replace(/[^\d.\-]/g, ''));
  return isFinite(n) ? n : null;
}
function f1(n){ if (n == null || !isFinite(n)) return '—'; return String(Math.round(n * 10) / 10); }
function fk(n){ return Math.round(n || 0).toLocaleString('en-US'); }
function signed(n){ const r = Math.round(n * 10) / 10; return (r > 0 ? '+' : r < 0 ? '−' : '') + Math.abs(r); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function estKcal(v){ return Math.round(4 * (v.protein || 0) + 9 * (v.fat || 0) + 4 * (v.carbs || 0)); }
function macroLine(m){
  const parts = ['蛋白质 ' + f1(m.protein || 0) + 'g', '脂肪 ' + f1(m.fat || 0) + 'g'];
  if (m.carbs != null && m.carbs !== '') parts.push('碳水 ' + f1(m.carbs) + 'g');
  return parts.join(' · ');
}
function totals(date){
  const t = {kcal: 0, protein: 0, fat: 0, carbs: 0, count: 0};
  for (const m of data.meals) if (m.date === date) {
    t.kcal += +m.kcal || 0; t.protein += +m.protein || 0; t.fat += +m.fat || 0; t.carbs += +m.carbs || 0; t.count++;
  }
  return t;
}
function carbAuto(){ const s = data.settings; return Math.max(0, Math.round((s.kcal - 4 * s.protein - 9 * s.fat) / 4)); }
function carbTarget(){ const c = data.settings.carbs; return c != null && c !== '' ? +c : carbAuto(); }
function sortedWeights(){ return data.weights.slice().sort((a, b) => a.date < b.date ? -1 : 1); }
function avgIn(ws, from, to){
  const xs = ws.filter(w => w.date >= from && w.date <= to).map(w => +w.kg);
  return xs.length ? {avg: xs.reduce((a, b) => a + b, 0) / xs.length, n: xs.length} : null;
}
/* 训练日与训练记录 */
const DAY_COLORS = ['#007AFF', '#AF52DE', '#FF9500', '#30B0C7', '#FF2D55', '#5856D6'];
const dayById = id => data.plan.days.find(d => d.id === id);
function dayColor(id){ const i = data.plan.days.findIndex(d => d.id === id); return i < 0 ? C.gray : DAY_COLORS[i % DAY_COLORS.length]; }
const daySets = day => day.exercises.reduce((a, e) => a + (+e.sets || 0), 0);
function workoutOf(date, day){ const w = data.workouts[date]; return w && day && w.day === day.id ? w : null; }
function workoutProgress(date){
  const day = dayById(data.training[date]);
  if (!day) return null;
  const w = workoutOf(date, day);
  let done = 0;
  if (w) for (const ex of day.exercises) {
    const e = w.ex[ex.id];
    if (e) for (let i = 0; i < ex.sets; i++) if (e.sets[i] && e.sets[i].done) done++;
  }
  return {day, done, total: daySets(day), cardio: !!(w && w.cardio)};
}
function hasLogged(date){
  const w = data.workouts[date];
  return !!w && Object.values(w.ex || {}).some(e => e.sets.some(s => s.done));
}
function ensureWorkout(date, day){
  let w = data.workouts[date];
  if (!w || w.day !== day.id) w = data.workouts[date] = {day: day.id, ex: {}, cardio: false};
  return w;
}
function ensureEx(w, ex){
  const e = w.ex[ex.id] || (w.ex[ex.id] = {name: ex.name, sets: []});
  e.name = ex.name;
  while (e.sets.length < ex.sets) e.sets.push({w: null, r: null, done: false});
  return e;
}
// 这个动作上一次（早于 date）完成的各组；按动作找不到时按同名动作找
function lastPerf(ex, before){
  const dates = Object.keys(data.workouts).filter(d => d < before).sort().reverse();
  for (const d of dates) {
    const w = data.workouts[d];
    if (!w || !w.ex) continue;
    const e = w.ex[ex.id] || Object.values(w.ex).find(x => x.name === ex.name);
    if (e && e.sets.some(s => s.done)) return e.sets.filter(s => s.done);
  }
  return null;
}
function perfText(sets){
  const ws = sets.map(s => s.w), sameW = ws.every(w => w === ws[0]);
  const reps = s => s.r != null ? s.r : '?';
  if (sameW) return (ws[0] != null ? f1(ws[0]) + ' kg × ' : '') + sets.map(reps).join(' / ');
  return sets.map(s => (s.w != null ? f1(s.w) : '?') + '×' + reps(s)).join(' / ');
}
// 读取页面上某一组填的重量和次数（包括预填的上次数据）
function readSet(exId, i){
  const get = f => { const el = document.querySelector(`.set-in[data-ex="${exId}"][data-i="${i}"][data-field="${f}"]`); return el ? num(el.value) : null; };
  const r = get('r');
  return {w: get('w'), r: r == null ? null : Math.round(r)};
}
function markDone(day, exList){
  const w = ensureWorkout(ui.date, day);
  for (const ex of exList) {
    const e = ensureEx(w, ex);
    for (let i = 0; i < ex.sets; i++) {
      const s = e.sets[i];
      if (s.done) continue;
      const v = readSet(ex.id, i), prev = e.sets[i - 1];
      s.w = v.w != null ? v.w : prev ? prev.w : null;
      s.r = v.r != null ? v.r : prev ? prev.r : null;
      s.done = true;
    }
  }
}
function setDay(date, id){
  if ((data.training[date] || null) === id) return true;
  if (hasLogged(date) && !confirm('这天已经记录了训练，更换训练日会清空这些记录。确定更换吗？')) return false;
  delete data.workouts[date];
  if (id) data.training[date] = id; else delete data.training[date];
  save();
  return true;
}

function guessType(){
  const d = new Date(), h = d.getHours() + d.getMinutes() / 60;
  if (h >= 4 && h < 10.5) return 'breakfast';
  if (h >= 10.5 && h < 14.5) return 'lunch';
  if (h >= 16.5 && h < 21.5) return 'dinner';
  return 'snack';
}

/* 轻触反馈：安卓用震动；iOS 18 及以上借助系统开关控件触发触感 */
let hapticLabel = null;
function haptic(){
  try {
    if (navigator.vibrate) { navigator.vibrate(8); return; }
    if (!hapticLabel) {
      hapticLabel = document.createElement('label');
      hapticLabel.setAttribute('aria-hidden', 'true');
      hapticLabel.style.display = 'none';
      const input = document.createElement('input');
      input.type = 'checkbox'; input.setAttribute('switch', '');
      hapticLabel.appendChild(input);
      document.head.appendChild(hapticLabel);
    }
    hapticLabel.click();
  } catch (e) {}
}

/* ---------- 界面状态 ---------- */
const ui = {tab: 'today', date: today(), week: monday(today()), wRange: '30', hMetric: 'kcal', flash: null, planEdit: false, justSet: null};
let lastToday = today();
let animCharts = true; // 图表只在切换进来或换范围时播放入场动画

function render(){
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === ui.tab));
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === 'view-' + ui.tab));
  const views = {today: vToday, train: vTrain, weight: vWeight, history: vHistory, settings: vSettings};
  const view = $('#view-' + ui.tab);
  view.innerHTML = views[ui.tab]();
  animCharts = false;
  ui.flash = null;
  if (ui.justSet) { const b = view.querySelector(`.set[data-key="${ui.justSet}"] .set-btn`); if (b) b.classList.add('just'); ui.justSet = null; }
  syncSegments(view);
  runRings();
  runCounts();
  runProgress();
  $('#navbar-title').textContent = navTitle();
  updateNavbar();
}

/* ---------- 动效 ---------- */
// 分段控件：记住每组上一次的位置，重新渲染后白色滑块从旧位置滑到新位置
const segMemory = {};
function placeThumb(thumb, pos, animate){
  thumb.classList.toggle('instant', !animate);
  thumb.style.width = pos.w + 'px';
  thumb.style.transform = `translateX(${pos.x}px)`;
}
function syncSegments(root){
  root.querySelectorAll('.segmented').forEach(seg => {
    let thumb = seg.querySelector('.seg-thumb');
    const fresh = !thumb;
    if (fresh) { thumb = document.createElement('span'); thumb.className = 'seg-thumb'; seg.prepend(thumb); }
    const on = seg.querySelector('button.on');
    if (!on) { thumb.style.opacity = '0'; return; }
    thumb.style.opacity = '';
    const key = seg.dataset.seg, pos = {x: on.offsetLeft, w: on.offsetWidth}, prev = key && segMemory[key];
    if (fresh) {
      if (prev && (prev.x !== pos.x || prev.w !== pos.w) && !reducedMotion) {
        placeThumb(thumb, prev, false);
        thumb.getBoundingClientRect();
        placeThumb(thumb, pos, true);
      } else placeThumb(thumb, pos, false);
    } else placeThumb(thumb, pos, true);
    if (key) segMemory[key] = pos;
  });
}

// 圆环：从上一次显示的进度转到新进度（第一次打开从 0 开始）
const ringShown = {kcal: 0, protein: 0, fat: 0};
function runRings(){
  const els = document.querySelectorAll('.view.active .ring-prog');
  if (!els.length) return;
  els[0].getBoundingClientRect();
  requestAnimationFrame(() => els.forEach(el => {
    const p = +el.dataset.p, c = +el.dataset.c;
    el.style.strokeDashoffset = (c * (1 - p)).toFixed(2);
    el.style.strokeOpacity = p > 0 ? '1' : '0';
    ringShown[el.dataset.key] = p;
  }));
}

// 训练进度条：从上一次的长度长到新长度
let progShown = 0;
function runProgress(){
  const el = document.querySelector('.view.active .progress i');
  if (!el) return;
  const p = +el.dataset.p;
  el.style.transition = 'none';
  el.style.width = progShown * 100 + '%';
  el.getBoundingClientRect();
  el.style.transition = '';
  el.style.width = p * 100 + '%';
  progShown = p;
}

// 数字：从上一次显示的值滚动到新值
const countShown = {};
let countRAF = 0;
function countSpan(key, val, fmt){
  const from = countShown[key] || 0;
  return `<span class="count" data-key="${key}" data-to="${val}" data-fmt="${fmt}">${fmt === 'k' ? fk(from) : f1(from)}</span>`;
}
function runCounts(){
  const items = [...document.querySelectorAll('.view.active .count')].map(el => ({
    el, key: el.dataset.key, from: countShown[el.dataset.key] || 0, to: +el.dataset.to, fmt: el.dataset.fmt,
  }));
  cancelAnimationFrame(countRAF);
  if (!items.length) return;
  items.forEach(it => { countShown[it.key] = it.to; });
  const final = it => it.fmt === 'k' ? fk(it.to) : f1(it.to);
  if (reducedMotion || items.every(it => it.from === it.to)) { items.forEach(it => { it.el.textContent = final(it); }); return; }
  const t0 = performance.now(), D = 800;
  const step = now => {
    const p = Math.min(1, (now - t0) / D), e = 1 - Math.pow(1 - p, 3);
    items.forEach(it => {
      const v = it.from + (it.to - it.from) * e;
      it.el.textContent = p < 1 ? (it.fmt === 'k' ? fk(v) : String(Math.round(v))) : final(it);
    });
    if (p < 1) countRAF = requestAnimationFrame(step);
  };
  countRAF = requestAnimationFrame(step);
}

/* ---------- 今日 ---------- */
function rings(vals){
  const sw = 14, gap = 3; let r = 70 - sw / 2, out = '';
  for (const v of vals) {
    const c = 2 * Math.PI * r, p = Math.max(0, Math.min(v.p || 0, 1)), from = ringShown[v.key] || 0;
    out += `<circle cx="70" cy="70" r="${r}" fill="none" stroke="${v.color}" stroke-opacity=".18" stroke-width="${sw}"/>`;
    out += `<circle class="ring-prog" data-key="${v.key}" data-p="${p}" data-c="${c}" cx="70" cy="70" r="${r}" fill="none" stroke="${v.color}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${c.toFixed(2)} ${c.toFixed(2)}" style="stroke-dashoffset:${(c * (1 - from)).toFixed(2)};stroke-opacity:${from > 0 ? 1 : 0}" transform="rotate(-90 70 70)"/>`;
    r -= sw + gap;
  }
  return `<svg class="rings" viewBox="0 0 140 140" aria-hidden="true">${out}</svg>`;
}

function vTrain(){
  if (ui.planEdit) return vPlan();
  const d = ui.date, isT = d === today(), sel = data.training[d], day = dayById(sel);
  const header = title => `<header class="header"><div class="header-bar">${dateNav()}<button class="pill" data-action="plan-open">编辑计划</button></div>
    <p class="eyebrow">${md(d)} ${wd(d)}</p><h1>${esc(title)}</h1></header>`;

  // 还没选训练日
  if (!day && sel !== 'rest') {
    let h = header(isT ? '今天练什么？' : '这天练什么？');
    h += `<div class="list">${data.plan.days.map(x => `<button class="row" data-action="pick-day" data-id="${x.id}">
        <span class="tile code-tile" style="background:${dayColor(x.id)}">${esc(x.code)}</span>
        <div class="row-main"><div class="row-title">${esc(x.name)}</div><div class="row-sub">${x.exercises.length} 个动作 · ${daySets(x)} 组</div></div>
        <span class="chev">${I.chev}</span></button>`).join('')}
      <button class="row" data-action="pick-day" data-id="rest"><span class="tile" style="background:${C.gray}">${I.moon}</span>
        <div class="row-main"><div class="row-title">休息</div></div><span class="chev">${I.chev}</span></button>
    </div><p class="footer-note">选好之后会同步到今日页面。</p>`;
    return h;
  }

  // 休息日
  if (!day) {
    return header('休息日') + `<div class="card insight" style="color:var(--label2)">好好恢复。吃够蛋白质、睡够觉，下次训练才有力气加重。</div>
      <button class="btn plain" data-action="change-day">改为训练</button>`;
  }

  // 训练中
  const p = workoutProgress(d), w = workoutOf(d, day);
  let h = header(`${day.code} · ${day.name}`);
  h += `<div class="card">
    <div class="train-top">
      <div class="train-count">已完成 <b class="num">${countSpan('trainDone', p.done, 'k')}</b>/ ${p.total} 组</div>
      <button class="pill" data-action="train-all" ${p.done >= p.total ? 'disabled style="color:var(--label3)"' : ''}>${p.done >= p.total ? '全部完成' : '一键完成'}</button>
    </div>
    <div class="progress"><i data-p="${p.total ? p.done / p.total : 0}"></i></div>
  </div>`;

  day.exercises.forEach((ex, idx) => {
    const e = w && w.ex[ex.id], last = lastPerf(ex, d);
    const doneN = e ? e.sets.slice(0, ex.sets).filter(s => s.done).length : 0, allDone = doneN >= ex.sets;
    h += `<div class="card ex-card${allDone ? ' all-done' : ''}">
      <div class="ex-head"><span class="ex-idx">${allDone ? I.check : idx + 1}</span>
        <div class="row-main"><div class="ex-name">${esc(ex.name)}</div><div class="row-sub">${ex.sets} × ${esc(ex.reps)} 次 · 休息 ${esc(ex.rest)}</div></div></div>
      ${last ? `<div class="ex-info">上次 <b class="num">${esc(perfText(last))}</b></div>` : ''}
      ${ex.note ? `<div class="ex-info">${esc(ex.note)}</div>` : ''}
      <div class="sets">`;
    // 预填重量：这次已填的 → 这次前面组填的（加重后自动跟上） → 上次同一组 → 上一组
    // 预填次数：这次已填的 → 上次同一组 → 上一组
    let prevW = '', prevR = '', ownW = null;
    for (let i = 0; i < ex.sets; i++) {
      const s = e && e.sets[i], pre = last ? last[Math.min(i, last.length - 1)] : null;
      if (s && s.w != null) ownW = s.w;
      const wv = s && s.w != null ? s.w : ownW != null ? ownW : pre && pre.w != null ? pre.w : prevW;
      const rv = s && s.r != null ? s.r : pre && pre.r != null ? pre.r : prevR;
      prevW = wv; prevR = rv;
      const attrs = `data-ex="${ex.id}" data-i="${i}"`;
      h += `<div class="set${s && s.done ? ' done' : ''}" ${attrs} data-key="${ex.id}-${i}">
        <span class="set-no">${i + 1}</span>
        <label class="set-field"><input class="set-in" ${attrs} data-field="w" type="text" inputmode="decimal" autocomplete="off" placeholder="0" value="${wv === '' ? '' : f1(wv)}"><span>kg</span></label>
        <span class="set-x">×</span>
        <label class="set-field"><input class="set-in" ${attrs} data-field="r" type="text" inputmode="numeric" autocomplete="off" placeholder="0" value="${rv}"><span>次</span></label>
        <button class="set-btn" data-action="set-toggle" ${attrs} aria-label="第${i + 1}组完成">${I.check}</button>
      </div>`;
    }
    h += `</div><div class="ex-foot"><button class="text-btn" data-action="ex-done" data-ex="${ex.id}" ${allDone ? 'disabled' : ''}>${allDone ? '已完成' : '本动作全部完成'}</button></div></div>`;
  });

  h += `<div class="list"><label class="row">
      <div class="row-main"><div class="row-title">有氧</div>${day.cardio ? `<div class="row-sub">${esc(day.cardio)}</div>` : ''}</div>
      <span class="switch"><input type="checkbox" id="cardio" ${w && w.cardio ? 'checked' : ''}><span></span></span></label></div>
    <p class="footer-note">正式组不含热身组。大部分组保留 1–3 次余力；一个动作所有组都稳定做到次数上限，再小幅加重。</p>
    <button class="btn plain" data-action="change-day">更换训练日</button>`;
  return h;
}

function needsBackup(){
  if (!data.meals.length) return false;
  const ref = data.lastExport ? data.lastExport.slice(0, 10) : data.meals.reduce((a, m) => m.date < a ? m.date : a, today());
  return diffDays(ref, today()) >= 7;
}

// 从 AI 的回答里找出热量、蛋白质、脂肪、碳水；给范围时取中间值，有"合计/总计"时优先用合计
function parseNutrition(raw){
  const t = String(raw)
    .replace(/(\d),(\d{3})(?!\d)/g, '$1$2')
    .replace(/[，、]/g, ',').replace(/：/g, ':').replace(/[～~—–−]/g, '-')
    .replace(/\s*(?:到|至)\s*(?=\d)/g, '-');
  const N = '(\\d+(?:\\.\\d+)?)(?:\\s*-\\s*(\\d+(?:\\.\\d+)?))?';
  const pick = m => m ? (m[2] ? (parseFloat(m[1]) + parseFloat(m[2])) / 2 : parseFloat(m[1])) : null;
  const grab = (src, labels, unit) => {
    for (const lb of labels) {
      const m = src.match(new RegExp('(?:' + lb + ')[^\\d\\n]{0,12}?' + N + '\\s*' + unit, 'i'));
      if (m) return pick(m);
    }
    return null;
  };
  const gu = '(?:g|克|grams?)?';
  const scan = src => ({
    kcal: grab(src, ['热量', '卡路里', '能量', 'calories', 'calorie', 'energy'], '(?:kcal|千卡|大卡|卡|cal)?') ?? pick(src.match(new RegExp(N + '\\s*(?:kcal|千卡|大卡)', 'i'))),
    protein: grab(src, ['蛋白质', 'protein', '蛋白'], gu),
    fat: grab(src, ['脂肪', 'fat'], gu),
    carbs: grab(src, ['碳水化合物', '碳水', 'carbohydrates?', 'carbs?'], gu),
  });
  const r = scan(t);
  const at = Math.max(...['合计', '总计', '总共', '一共', '整餐', 'total'].map(k => t.toLowerCase().lastIndexOf(k)));
  if (at >= 0) { const tr = scan(t.slice(at)); for (const k in tr) if (tr[k] != null) r[k] = tr[k]; }
  return r;
}
function applyNutrition(text){
  const r = parseNutrition(text), names = {kcal: '热量', protein: '蛋白质', fat: '脂肪', carbs: '碳水'};
  const keys = Object.keys(names).filter(k => r[k] != null);
  if (!keys.length) return false;
  for (const k of keys) {
    const el = $('#f-' + k); if (!el) continue;
    el.value = k === 'kcal' ? Math.round(r[k]) : f1(r[k]);
    const row = el.closest('.field');
    row.classList.remove('flash'); row.getBoundingClientRect(); row.classList.add('flash');
  }
  updateHint(); haptic();
  toast('已填入' + keys.map(k => names[k]).join('、'));
  return true;
}
function updateHint(){
  const hint = $('#f-hint'); if (!hint) return;
  const v = readForm(), est = estKcal(v);
  if (v.kcal == null && est > 0) { hint.hidden = false; hint.textContent = `按蛋白质、脂肪、碳水估算约 ${fk(est)} kcal · 点按填入`; }
  else hint.hidden = true;
}
function sheetSave(){
  const ctx = sheetCtx, v = readForm();
  const isPreset = ctx.mode === 'padd' || ctx.mode === 'pedit';
  if (v.kcal == null) {
    const est = estKcal(v);
    if (est > 0) v.kcal = est;

  }
  if (v.kcal < 0 || v.protein < 0 || v.fat < 0 || (v.carbs != null && v.carbs < 0)) { toast('数值不能为负'); return; }
  if (!v.name) v.name = isPreset ? '常用餐' : MEAL_NAME[v.type];

  if (ctx.mode === 'add') {
    const meal = Object.assign({id: uid(), date: ui.date, created: Date.now()}, v);
    data.meals.push(meal);
    const alsoPreset = $('#f-preset') && $('#f-preset').checked;

    save(); closeSheet(); ui.flash = meal.id; render(); haptic();

}

// 按住面板顶部向下拖可以关闭，和 iOS 一样
(function sheetDrag(){
  const sheet = $('#sheet'), back = $('#backdrop');
  let dragging = false, pid = null, startY = 0, dy = 0, lastY = 0, lastT = 0, vel = 0;
  sheet.addEventListener('pointerdown', e => {
    if (!sheetCtx || !e.target.closest('.sheet-top') || e.target.closest('button')) return;
    dragging = true; pid = e.pointerId; startY = lastY = e.clientY; lastT = performance.now(); dy = 0; vel = 0;
    try { sheet.setPointerCapture(pid); } catch (err) {}
    sheet.classList.add('dragging'); back.classList.add('dragging');
  });
  sheet.addEventListener('pointermove', e => {
    if (!dragging || e.pointerId !== pid) return;
    const now = performance.now(), raw = e.clientY - startY;
    vel = vel * .6 + ((e.clientY - lastY) / Math.max(1, now - lastT)) * .4;
    lastY = e.clientY; lastT = now;
    dy = raw > 0 ? raw : -Math.pow(-raw, .7); // 往上拖有橡皮筋阻尼
    sheet.style.transform = `translateY(${dy}px)`;
    back.style.opacity = String(Math.max(0, 1 - Math.max(dy, 0) / sheet.offsetHeight));
  });
  const end = e => {
    if (!dragging || e.pointerId !== pid) return;
    dragging = false;
    sheet.classList.remove('dragging'); back.classList.remove('dragging');
    sheet.style.transform = ''; back.style.opacity = '';
    if (dy > sheet.offsetHeight * .3 || (dy > 30 && vel > .5)) closeSheet();
  };
  sheet.addEventListener('pointerup', end);
  sheet.addEventListener('pointercancel', end);
})();

// 训练计划里按住 ≡ 拖动调整动作顺序
(function planDrag(){
  let st = null;
  document.addEventListener('pointerdown', e => {
    const h = e.target.closest('.handle'); if (!h) return;
    const row = h.closest('.row'), list = row.parentElement, rows = [...list.querySelectorAll('.row[data-ex]')];
    e.preventDefault();
    st = {row, list, rows, idx: rows.indexOf(row), target: rows.indexOf(row), y0: e.clientY, h: row.offsetHeight, pid: e.pointerId, dayId: row.dataset.day};
    try { h.setPointerCapture(e.pointerId); } catch (err) {}
    list.classList.add('dragging'); row.classList.add('lifting');
    rows.forEach(r => { if (r !== row) r.classList.add('shifting'); });
    haptic();
  });
  document.addEventListener('pointermove', e => {
    if (!st || e.pointerId !== st.pid) return;
    const dy = e.clientY - st.y0;
    st.row.style.transform = `translateY(${dy}px) scale(1.02)`;
    const t = Math.max(0, Math.min(st.rows.length - 1, st.idx + Math.round(dy / st.h)));
    if (t !== st.target) { st.target = t; haptic(); }
    st.rows.forEach((r, i) => {
      if (r === st.row) return;
      const s = i > st.idx && i <= t ? -st.h : i < st.idx && i >= t ? st.h : 0;
      r.style.transform = s ? `translateY(${s}px)` : '';
    });
  });
  const end = e => {
    if (!st || e.pointerId !== st.pid) return;
    const {idx, target, dayId} = st, day = dayById(dayId);
    st = null;
    if (day && target !== idx) { const [m] = day.exercises.splice(idx, 1); day.exercises.splice(target, 0, m); save(); }
    render();
  };
  document.addEventListener('pointerup', end);
  document.addEventListener('pointercancel', end);
})();

function advice(w1, w2, w3){
  const tone = (color, icon, title, text) => ({color, icon, title, text});
  if (!w1 || !w2 || w1.n < 3 || w2.n < 3)
    return tone(C.gray, I.info, '继续记录', '最近两周各记录至少 3 天后，这里会根据体重趋势给出调整建议。目标是每周下降 0.5–0.8 kg。');
  const loss = w2.avg - w1.avg;
  if (loss > 1)
    return tone(C.fat, I.warn, '掉得偏快', `过去一周平均下降 ${f1(loss)} kg，超过 1 kg 容易掉肌肉。适当多吃一点，例如每餐多加半份米饭；如果训练力量也在下滑，更要加。`);
  if (loss >= 0.5)
    return tone(C.protein, I.check, '节奏很好', `过去一周平均下降 ${f1(loss)} kg，在目标区间内，保持现在的吃法。`);
  if (loss >= 0.2)
    return tone(C.blue, I.down, '在下降，稍慢', `过去一周平均下降 ${f1(loss)} kg，略低于 0.5 kg 的目标，可以再观察一周。`);
  if (w3 && w3.n >= 3 && w3.avg - w1.avg < 0.4)
    return tone(C.red, I.warn, '连续两周几乎没掉', `两周累计变化 ${signed(w1.avg - w3.avg)} kg。每餐米饭再少一点（约少 1/3），同时留意饮料和零食。`);
  return tone(C.blue, I.info, '这周掉得少', `过去一周变化 ${signed(-loss)} kg。体重有日常波动，先保持一周再看；如果下周还是这样，就减少一些米饭。`);
}

function weightChart(ws, anim){
  const t = today();
  const from = ui.wRange === 'all' ? (ws[0] ? ws[0].date : t) : addDays(t, -(+ui.wRange - 1));
  const pts = ws.filter(w => w.date >= from);
  if (pts.length < 2) return `<div class="empty-chart">记录两天以上的体重后，这里会显示曲线</div>`;
  const avg = pts.map(p => ({date: p.date, kg: avgIn(ws, addDays(p.date, -6), p.date).avg}));
  const W = 340, H = 180, L = 36, R = 12, T = 12, B = 26;
  const start = pts[0].date, end = pts[pts.length - 1].date, span = Math.max(1, diffDays(start, end));
  const vals = pts.map(p => +p.kg).concat(avg.map(a => a.kg));
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (hi - lo < 1) { const m = (hi + lo) / 2; lo = m - .5; hi = m + .5; }
  const padV = (hi - lo) * .12; lo -= padV; hi += padV;
  const x = d => L + diffDays(start, d) / span * (W - L - R);
  const y = v => T + (hi - v) / (hi - lo) * (H - T - B);
  let g = '';
  for (let i = 0; i <= 3; i++) {
    const v = lo + (hi - lo) * i / 3, yy = y(v).toFixed(1);
    g += `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}" stroke="rgba(60,60,67,.12)"/><text x="${L - 6}" y="${+yy + 3.5}" text-anchor="end" class="ax">${v.toFixed(1)}</text>`;
  }
  const dots = pts.map((p, i) => `<circle${anim ? ` class="pop" style="animation-delay:${(.15 + i / pts.length * .8).toFixed(2)}s"` : ''} cx="${x(p.date).toFixed(1)}" cy="${y(p.kg).toFixed(1)}" r="3.2" fill="${C.blue}" fill-opacity=".3"/>`).join('');
  const line = avg.map((a, i) => (i ? 'L' : 'M') + x(a.date).toFixed(1) + ' ' + y(a.kg).toFixed(1)).join(' ');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="体重趋势">${g}${dots}
    <path${anim ? ' class="draw" pathLength="1"' : ''} d="${line}" fill="none" stroke="${C.blue}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="${L}" y="${H - 6}" class="ax">${mdShort(start)}</text><text x="${W - R}" y="${H - 6}" text-anchor="end" class="ax">${mdShort(end)}</text></svg>`;
}

function barChart(rows, key, anim){
  const target = data.settings[key], color = C[key], t = today();
  const W = 340, H = 170, L = 8, R = 8, T = 22, B = 24;
  const vals = rows.map(r => r.t[key]);

  const iw = (W - L - R) / 7, bw = Math.min(24, iw * .52);

  rows.forEach((r, i) => {

    }

}

function weekText(ws){
  const st = weekStats(ws), s = data.settings, we = addDays(ws, 6), all = sortedWeights();
  const L = [];
  L.push(`【饮食周汇总】${mdShort(ws)}（${wd(ws)}）– ${mdShort(we)}（${wd(we)}）`);
  L.push(`每日目标：热量 ${fk(s.kcal)} kcal · 蛋白质 ${f1(s.protein)} g · 脂肪 ${f1(s.fat)} g · 碳水 ${f1(carbTarget())} g`);
  if (st.logged.length) L.push(`日均摄入（按记录的 ${st.logged.length} 天）：热量 ${fk(st.kcal)} kcal · 蛋白质 ${f1(st.protein)} g · 脂肪 ${f1(st.fat)} g · 碳水 ${f1(st.carbs)} g`);
  else L.push('本周没有饮食记录');
  L.push(`蛋白质达标：${st.hit} 天；训练：${st.byDay.map(x => `${x.day.code}（${x.day.name}）${x.n} 次`).join('，')}`);
  if (st.w) L.push(`体重：本周平均 ${f1(st.w.avg)} kg（${st.w.n} 次称重）${st.wPrev ? `，较上周 ${signed(st.w.avg - st.wPrev.avg)} kg` : ''}`);
  L.push('', '每日明细：');
  for (const r of st.rows) {
    const p = workoutProgress(r.d);
    const tr = p ? '训练 ' + p.day.code : '休息';
    const w = all.find(x => x.date === r.d);
    L.push(`${mdShort(r.d)} ${wd(r.d)}［${tr}］${r.t.count ? `合计 ${fk(r.t.kcal)} kcal · 蛋白质 ${f1(r.t.protein)} g · 脂肪 ${f1(r.t.fat)} g · 碳水 ${f1(r.t.carbs)} g` : '未记录饮食'}${w ? ` · 体重 ${f1(w.kg)} kg` : ''}`);
    const ms = data.meals.filter(m => m.date === r.d).sort((a, b) => MEALS.findIndex(x => x[0] === a.type) - MEALS.findIndex(x => x[0] === b.type) || (a.created || 0) - (b.created || 0));
    for (const m of ms) L.push(`  - ${MEAL_NAME[m.type]}｜${m.name}：${fk(m.kcal)} kcal，${macroLine(m)}`);
    if (p) {
      L.push(`  · 训练 ${p.day.code} ${p.day.name}：完成 ${p.done}/${p.total} 组${p.cardio ? '，有氧 ✓' : ''}`);
      const wo = workoutOf(r.d, p.day);
      for (const ex of p.day.exercises) {
        const e = wo && wo.ex[ex.id], done = e ? e.sets.slice(0, ex.sets).filter(s => s.done) : [];
        L.push(`    - ${ex.name}：${done.length ? perfText(done) + (done.length < ex.sets ? `（${done.length}/${ex.sets} 组）` : '') : '未做'}`);
      }
    }
  }
  return L.join('\n');
}
async function copyText(text){
  try { await navigator.clipboard.writeText(text); return true; } catch (e) {}
  try {
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
    const ok = document.execCommand('copy'); ta.remove(); return ok;
  } catch (e) { return false; }
}

async function exportData(){
  const stamp = new Date().toISOString();
  const payload = JSON.stringify({app: 'diet-tracker', version: 1, exportedAt: stamp, data: Object.assign({}, data, {lastExport: stamp})}, null, 2);
  const name = `饮食记录备份-${today()}.json`;
  const done = () => { data.lastExport = stamp; save(); render(); toast('已导出备份'); };
  try {
    const file = new File([payload], name, {type: 'application/json'});
    if (navigator.canShare && navigator.canShare({files: [file]})) { await navigator.share({files: [file], title: name}); done(); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  try {
    const url = URL.createObjectURL(new Blob([payload], {type: 'application/json'}));
    const a = document.createElement('a'); a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    done();
  } catch (e) { toast('导出失败'); }
}
function importFile(file){
  const reader = new FileReader();
  reader.onload = () => {
    let obj;
    try { obj = JSON.parse(reader.result); } catch (e) { toast('文件格式不正确'); return; }
    const d = obj && obj.data ? obj.data : obj;
    if (!d || !Array.isArray(d.meals)) { toast('这不是饮食记录的备份文件'); return; }
    const nd = normalize(d);
    if (!confirm(`导入会覆盖当前的全部数据。\n备份里有 ${nd.meals.length} 条饮食、${nd.weights.length} 条体重记录。确定导入吗？`)) return;
    data = nd; save(); render(); toast('已导入备份');
  };
  reader.onerror = () => toast('读取文件失败');
  reader.readAsText(file);
}

let toastTimer = null, undoFn = null;
function toast(msg, undo, label = '撤销', ms){
  const el = $('#toast');
  el.innerHTML = `<span>${esc(msg)}</span>${undo ? `<button data-action="toast-undo">${esc(label)}</button>` : ''}`;
  undoFn = undo || null;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.classList.remove('show'); undoFn = null; }, ms || (undo ? 4500 : 2200));
}

document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'import-file' && el.files && el.files[0]) { importFile(el.files[0]); return; }
  if (el.id === 'cardio' || el.classList.contains('set-in')) {
    const day = dayById(data.training[ui.date]); if (!day) return;
    const w = ensureWorkout(ui.date, day);
    if (el.id === 'cardio') { w.cardio = el.checked; if (el.checked) haptic(); }
    else {
      const ex = day.exercises.find(x => x.id === el.dataset.ex); if (!ex) return;
      const v = num(el.value), rec = ensureEx(w, ex), i = +el.dataset.i;
      rec.sets[i][el.dataset.field] = v == null ? null : el.dataset.field === 'r' ? Math.round(v) : v;
      // 改了重量（比如加重），后面还没做、也没单独改过的组跟着变
      if (el.dataset.field === 'w') for (let j = i + 1; j < ex.sets; j++) {
        if (rec.sets[j].done || rec.sets[j].w != null) break;
        const nx = document.querySelector(`.set-in[data-ex="${ex.id}"][data-i="${j}"][data-field="w"]`);
        if (nx) nx.value = v == null ? '' : f1(v);
      }
    }
    save(); return;
  }
  const key = el.dataset && el.dataset.setting;
  if (!key) return;
  const v = num(el.value);
  if (key === 'carbs' && v == null) data.settings.carbs = null;
  else if (v == null || v <= 0) { toast('请输入大于 0 的数字'); render(); return; }
  else data.settings[key] = Math.round(v * 10) / 10;
  save(); render(); toast('目标已更新');
});

  if (document.visibilityState !== 'visible') return;
  const t = today();
  if (t !== lastToday) {
    if (ui.date === lastToday) ui.date = t;
    if (ui.week === monday(lastToday)) ui.week = monday(t);
    lastToday = t;
    if (!sheetCtx) render();
  }
});

/* 主屏幕图标：三个圆环 */
function makeIcon(){
  try {
    const c = document.createElement('canvas'); c.width = c.height = 180;
    const x = c.getContext('2d');
    x.fillStyle = '#fff'; x.fillRect(0, 0, 180, 180);
    x.lineCap = 'round'; x.lineWidth = 15;
    [[60, C.kcal, .78], [42, C.protein, .62], [24, C.fat, .5]].forEach(([r, col, p]) => {
      x.strokeStyle = col + '30'; x.beginPath(); x.arc(90, 90, r, 0, Math.PI * 2); x.stroke();
      x.strokeStyle = col; x.beginPath(); x.arc(90, 90, r, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * p); x.stroke();
    });
    $('#touch-icon').href = c.toDataURL('image/png');
  } catch (e) {}
}

/* 离线缓存：第一次打开后，之后断网或网站访问慢也能秒开 */
function registerSW(){
  const ok = 'serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1');
  if (!ok) return;
  navigator.serviceWorker.addEventListener('message', e => {
    if (e.data && e.data.type === 'updated') toast('新版本已就绪', () => location.reload(), '刷新', 10000);
  });
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}

makeIcon();
registerSW();
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
render();
})();
</script>
